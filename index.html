<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance JS Agar.io Clone with Custom Skin & Color Effects</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            background: #1a1a1a;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            width: 180px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #leaderboard h3 {
            font-size: 14px;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 4px;
        }
        #leaderboard ol {
            padding-left: 20px;
            font-size: 13px;
        }
        #leaderboard li {
            margin-bottom: 4px;
        }
        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            z-index: 30;
            border: 2px solid #2ed573;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 320px;
        }
        #start-screen h1 {
            margin-bottom: 25px;
            font-size: 24px;
            color: #2ed573;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .form-group input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }
        #start-screen button, #game-over button {
            width: 100%;
            background: #2ed573;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #start-screen button:hover, #game-over button:hover {
            background: #26af5f;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            display: none;
            z-index: 20;
            border: 2px solid #ff4757;
            width: 300px;
        }
        #game-over h1 {
            color: #ff4757;
            margin-bottom: 15px;
        }
        #game-over p {
            margin-bottom: 20px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Agar.io Web Clone</h1>
        <div class="form-group">
            <label for="nameInput">Your Cell Name:</label>
            <input type="text" id="nameInput" value="Player" maxlength="15">
        </div>
        <div class="form-group">
            <label for="colorInput">Cell Aura Color Effect:</label>
            <input type="color" id="colorInput" value="#2ed573">
        </div>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="ui">
        Score: <span id="score">10</span><br>
        Mass: <span id="mass">10</span>
    </div>

    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <ol id="leaderboard-list"></ol>
    </div>

    <div id="game-over">
        <h1>Eaten!</h1>
        <p>Your cell was absorbed by a larger organism.</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to full window
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // World Configuration
        const WORLD_WIDTH = 4000;
        const WORLD_HEIGHT = 4000;
        const CELL_GRID_SIZE = 150;

        // Robust Image Loading with Local File Security (CORS/file://) Fallback Handling
        const ball = new Image();
        let ballLoaded = false;
        
        ball.onload = () => {
            ballLoaded = true;
        };
        
        ball.onerror = () => {
            // Automatic built-in SVG fallback pattern if local file access is restricted by browser security
            ball.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0xMDA+CiAgPGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iNDgiIGZpbGw9IiNmZmYiIG9wYWNpdHk9IjAuODUiLz4KICA8Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIyOCIgZmlsbD0iIzNmZmYiIG9wYWNpdHk9IjAuMiIvPgo8L3N2Zz4=";
        };
        
        ball.src = "ball.png";

        // High-Performance Spatial Hash Grid for Broad-Phase Collision
        class SpatialHashGrid {
            constructor(width, height, cellSize) {
                this.width = width;
                this.height = height;
                this.cellSize = cellSize;
                this.cols = Math.ceil(width / cellSize);
                this.rows = Math.ceil(height / cellSize);
                this.grid = new Map();
            }

            clear() {
                this.grid.clear();
            }

            insert(entity) {
                let r = entity.radius;
                let startCol = Math.max(0, Math.floor((entity.x - r) / this.cellSize));
                let endCol = Math.min(this.cols - 1, Math.floor((entity.x + r) / this.cellSize));
                let startRow = Math.max(0, Math.floor((entity.y - r) / this.cellSize));
                let endRow = Math.min(this.rows - 1, Math.floor((entity.y + r) / this.cellSize));

                for (let c = startCol; c <= endCol; c++) {
                    for (let ro = startRow; ro <= endRow; ro++) {
                        let key = c + ',' + ro;
                        if (!this.grid.has(key)) this.grid.set(key, []);
                        this.grid.get(key).push(entity);
                    }
                }
            }

            retrieve(entity) {
                let candidates = new Set();
                let r = entity.radius;
                let startCol = Math.max(0, Math.floor((entity.x - r) / this.cellSize));
                let endCol = Math.min(this.cols - 1, Math.floor((entity.x + r) / this.cellSize));
                let startRow = Math.max(0, Math.floor((entity.y - r) / this.cellSize));
                let endRow = Math.min(this.rows - 1, Math.floor((entity.y + r) / this.cellSize));

                for (let c = startCol; c <= endCol; c++) {
                    for (let ro = startRow; ro <= endRow; ro++) {
                        let key = c + ',' + ro;
                        let cellEntities = this.grid.get(key);
                        if (cellEntities) {
                            for (let i = 0; i < cellEntities.length; i++) {
                                candidates.add(cellEntities[i]);
                            }
                        }
                    }
                }
                return candidates;
            }
        }

        const spatialGrid = new SpatialHashGrid(WORLD_WIDTH, WORLD_HEIGHT, CELL_GRID_SIZE);

        // Food Class
        class Food {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.mass = 1;
                this.color = color || `hsl(${Math.random() * 360}, 80%, 60%)`;
            }

            draw(camera) {
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Blob Class (Player & Bots) with Color Changer Effect Script
        class Blob {
            constructor(x, y, mass, color, name, isAI = false) {
                this.x = x;
                this.y = y;
                this.mass = mass;
                this.updateRadius();
                this.color = color; // Base color / custom color effect
                this.name = name;
                this.isAI = isAI;
                this.vx = 0;
                this.vy = 0;
                this.targetX = x;
                this.targetY = y;
                this.aiTimer = 0;
            }

            updateRadius() {
                this.radius = Math.sqrt(this.mass) * 4;
            }

            update() {
                this.updateRadius();
                let speed = Math.max(1.2, 5 - (this.mass / 200));

                if (this.isAI) {
                    this.aiTimer--;
                    if (this.aiTimer <= 0) {
                        this.targetX = this.x + (Math.random() - 0.5) * 600;
                        this.targetY = this.y + (Math.random() - 0.5) * 600;
                        this.aiTimer = Math.floor(Math.random() * 60) + 30;
                    }
                } else {
                    let dx = mouse.x - canvas.width / 2;
                    let dy = mouse.y - canvas.height / 2;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 1) {
                        this.targetX = this.x + dx * 5;
                        this.targetY = this.y + dy * 5;
                    }
                }

                let angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                let currentSpeed = this.isAI ? speed * 0.7 : speed;
                
                this.vx = Math.cos(angle) * currentSpeed;
                this.vy = Math.sin(angle) * currentSpeed;

                this.x += this.vx;
                this.y += this.vy;

                this.x = Math.max(this.radius, Math.min(WORLD_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(WORLD_HEIGHT - this.radius, this.y));

                if (this.mass > 200 && Math.random() < 0.05) {
                    this.mass -= 0.1;
                }
            }

            draw(camera) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
                ctx.clip();

                // 1. Draw the image texture ("ball.png" or fallback)
                if (ballLoaded || (ball.complete && ball.naturalWidth > 0)) {
                    ctx.drawImage(ball, this.x - camera.x - this.radius, this.y - camera.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    // Procedural textured fill if image is still pending load
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x - camera.x - this.radius, this.y - camera.y - this.radius, this.radius * 2, this.radius * 2);
                }

                // 2. Color Changer Script Effect: Dynamic Aura / Color Overlay on top of the image
                let auraGradient = ctx.createRadialGradient(
                    this.x - camera.x - this.radius * 0.25, 
                    this.y - camera.y - this.radius * 0.25, 
                    this.radius * 0.05, 
                    this.x - camera.x, 
                    this.y - camera.y, 
                    this.radius
                );
                auraGradient.addColorStop(0, this.color + '33'); // Soft glow center
                auraGradient.addColorStop(0.7, this.color + '77'); // Accent mid-tone
                auraGradient.addColorStop(1, this.color + 'cc'); // Vibrant edge tint

                ctx.fillStyle = auraGradient;
                ctx.fillRect(this.x - camera.x - this.radius, this.y - camera.y - this.radius, this.radius * 2, this.radius * 2);

                ctx.restore();

                // Outer crisp border ring matching player/bot color
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(2, this.radius * 0.08);
                ctx.strokeStyle = this.color;
                ctx.stroke();

                // Draw Name & Mass Text
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.max(12, Math.min(24, this.radius * 0.4))}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.name, this.x - camera.x, this.y - camera.y - (this.radius > 20 ? 6 : 0));
                
                if (this.radius > 25) {
                    ctx.font = `${Math.max(10, this.radius * 0.25)}px sans-serif`;
                    ctx.fillText(Math.floor(this.mass), this.x - camera.x, this.y - camera.y + 12);
                }
            }
        }

        // Game State
        let player = null;
        let foods = [];
        let bots = [];
        let camera = { x: 0, y: 0 };
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let isGameOver = false;
        let gameStarted = false;

        const botNames = ['Apex', 'Blobby', 'Titan', 'Cosmo', 'Vortex', 'Pulse', 'Zeus', 'Shadow', 'Neo', 'Goliath'];

        function startGame() {
            let playerName = document.getElementById('nameInput').value.trim() || 'Player';
            let playerColor = document.getElementById('colorInput').value;

            document.getElementById('start-screen').style.display = 'none';

            foods = [];
            bots = [];

            // Spawn Food
            for (let i = 0; i < 600; i++) {
                foods.push(new Food(Math.random() * WORLD_WIDTH, Math.random() * WORLD_HEIGHT));
            }

            // Spawn AI Bots with randomized distinct color effects
            for (let i = 0; i < 25; i++) {
                let bx = Math.random() * WORLD_WIDTH;
                let by = Math.random() * WORLD_HEIGHT;
                let bMass = Math.floor(Math.random() * 40) + 10;
                let bColor = `hsl(${Math.random() * 360}, 80%, 55%)`;
                let bName = botNames[Math.floor(Math.random() * botNames.length)] + Math.floor(Math.random() * 99);
                bots.push(new Blob(bx, by, bMass, bColor, bName, true));
            }

            // Initialize Player with custom configured name and color effect
            player = new Blob(WORLD_WIDTH / 2, WORLD_HEIGHT / 2, 15, playerColor, playerName, false);
            isGameOver = false;
            gameStarted = true;
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function restartGame() {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
            gameStarted = false;
        }

        // Main Engine Update
        function update() {
            if (!gameStarted || isGameOver) return;

            player.update();

            for (let i = 0; i < bots.length; i++) {
                bots[i].update();
            }

            // Rebuild Spatial Hash Grid
            spatialGrid.clear();
            for (let i = 0; i < foods.length; i++) spatialGrid.insert(foods[i]);
            for (let i = 0; i < bots.length; i++) spatialGrid.insert(bots[i]);
            spatialGrid.insert(player);

            // Player Collisions
            let playerCandidates = spatialGrid.retrieve(player);
            for (let entity of playerCandidates) {
                let dx = player.x - entity.x;
                let dy = player.y - entity.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (entity instanceof Food) {
                    if (dist < player.radius + entity.radius) {
                        player.mass += entity.mass;
                        entity.x = Math.random() * WORLD_WIDTH;
                        entity.y = Math.random() * WORLD_HEIGHT;
                    }
                } else if (entity instanceof Blob && entity !== player) {
                    if (player.mass > entity.mass * 1.1 && dist < player.radius) {
                        player.mass += entity.mass;
                        entity.x = Math.random() * WORLD_WIDTH;
                        entity.y = Math.random() * WORLD_HEIGHT;
                        entity.mass = Math.floor(Math.random() * 30) + 10;
                    } else if (entity.mass > player.mass * 1.1 && dist < entity.radius) {
                        isGameOver = true;
                        document.getElementById('game-over').style.display = 'block';
                    }
                }
            }

            // Bot Collisions
            for (let i = 0; i < bots.length; i++) {
                let bot = bots[i];
                let candidates = spatialGrid.retrieve(bot);

                for (let entity of candidates) {
                    let dx = bot.x - entity.x;
                    let dy = bot.y - entity.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (entity instanceof Food) {
                        if (dist < bot.radius + entity.radius) {
                            bot.mass += entity.mass;
                            entity.x = Math.random() * WORLD_WIDTH;
                            entity.y = Math.random() * WORLD_HEIGHT;
                        }
                    } else if (entity instanceof Blob && entity !== bot) {
                        if (bot.mass > entity.mass * 1.1 && dist < bot.radius) {
                            bot.mass += entity.mass;
                            if (entity === player) {
                                isGameOver = true;
                                document.getElementById('game-over').style.display = 'block';
                            } else {
                                entity.x = Math.random() * WORLD_WIDTH;
                                entity.y = Math.random() * WORLD_HEIGHT;
                                entity.mass = Math.floor(Math.random() * 30) + 10;
                            }
                        }
                    }
                }
            }

            // Smooth Camera Follow
            let targetCamX = player.x - canvas.width / 2;
            let targetCamY = player.y - canvas.height / 2;
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            // UI updates
            document.getElementById('score').innerText = Math.floor(player.mass);
            document.getElementById('mass').innerText = Math.floor(player.mass);

            updateLeaderboard();
        }

        function updateLeaderboard() {
            if (!player) return;
            let allBlobs = [player, ...bots];
            allBlobs.sort((a, b) => b.mass - a.mass);

            let listHTML = '';
            for (let i = 0; i < Math.min(5, allBlobs.length); i++) {
                listHTML += `<li>${allBlobs[i].name}: ${Math.floor(allBlobs[i].mass)}</li>`;
            }
            document.getElementById('leaderboard-list').innerHTML = listHTML;
        }

        // Render Loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) return;

            // Background Grid Lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            let gridSize = 50;
            let startX = - (camera.x % gridSize);
            let startY = - (camera.y % gridSize);

            ctx.beginPath();
            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // World Border bounds
            ctx.strokeStyle = '#ff4757';
            ctx.lineWidth = 4;
            ctx.strokeRect(-camera.x, -camera.y, WORLD_WIDTH, WORLD_HEIGHT);

            // Draw Foods
            for (let i = 0; i < foods.length; i++) {
                foods[i].draw(camera);
            }

            // Draw Bots
            for (let i = 0; i < bots.length; i++) {
                bots[i].draw(camera);
            }

            // Draw Player
            if (player) {
                player.draw(camera);
            }
        }

        // Master Frame Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
